name: Mirror to Azure Repos

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    name: Push to Azure Repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        run: |
          git fetch --all --tags

      - name: Rewrite non-org commit emails
        run: |
          git filter-branch --env-filter '

            # Define your allowed email domain
            ALLOWED_DOMAIN="kabuni.com"

            # Function to rewrite email if it does not match the allowed domain
            rewrite_if_needed() {
              local email="$1"
              local name="$2"
              if echo "$email" | grep -qv "@${ALLOWED_DOMAIN}$"; then
                # Replace spaces/special chars in name, lowercase it
                local safe_name=$(echo "$name" | tr "[:upper:]" "[:lower:]" | sed "s/[^a-z0-9]/-/g" | sed "s/--*/-/g" | sed "s/^-//;s/-$//")
                echo "${safe_name}@${ALLOWED_DOMAIN}"
              else
                echo "$email"
              fi
            }

            export GIT_AUTHOR_EMAIL=$(rewrite_if_needed "$GIT_AUTHOR_EMAIL" "$GIT_AUTHOR_NAME")
            export GIT_COMMITTER_EMAIL=$(rewrite_if_needed "$GIT_COMMITTER_EMAIL" "$GIT_COMMITTER_NAME")

          ' --tag-name-filter cat -- --all

      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          git remote add azure "https://mirror:${AZURE_PAT}@${AZURE_URL}"

          git push azure --all --force
          git push azure --tags --force

          echo "✅ Successfully mirrored to Azure Repos"
