name: Mirror to Azure Repos

# ──────────────────────────────────────────────
# Trigger: every push to any branch + tag pushes
# ──────────────────────────────────────────────
on:
  push:
    branches:
      - '**'
    tags:
      - '**'

  # Optional: allows you to manually trigger a sync
  workflow_dispatch:

jobs:
  mirror:
    name: Push to Azure Repos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Full clone (not shallow) so all history is available
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Fetch all branches and tags explicitly
      - name: Fetch all refs
        run: |
          git fetch --all --tags

      # 3. Rewrite bot commit emails to pass Azure DevOps policy
      - name: Rewrite bot commit emails
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          git filter-branch --env-filter '
            # Lovable (GPT Engineer) bot
            if [ "$GIT_AUTHOR_EMAIL" = "159125892+gpt-engineer-app[bot]@users.noreply.github.com" ]; then
              export GIT_AUTHOR_EMAIL="lovable-bot@kabuni.com"
              export GIT_AUTHOR_NAME="Lovable Bot"
            fi
            if [ "$GIT_COMMITTER_EMAIL" = "159125892+gpt-engineer-app[bot]@users.noreply.github.com" ]; then
              export GIT_COMMITTER_EMAIL="lovable-bot@kabuni.com"
              export GIT_COMMITTER_NAME="Lovable Bot"
            fi

            # GitHub noreply addresses (e.g. users who have email privacy enabled)
            if echo "$GIT_AUTHOR_EMAIL" | grep -q "users.noreply.github.com"; then
              export GIT_AUTHOR_EMAIL="${GIT_AUTHOR_NAME// /.}@kabuni.com"
            fi
            if echo "$GIT_COMMITTER_EMAIL" | grep -q "users.noreply.github.com"; then
              export GIT_COMMITTER_EMAIL="${GIT_COMMITTER_NAME// /.}@kabuni.com"
            fi
          ' --tag-name-filter cat -- --all

      # 4. Add Azure Repos as a remote and push
      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          # Configure the Azure remote using the PAT for auth
          git remote add azure "https://mirror:${AZURE_PAT}@${AZURE_URL}"

          # Push all branches
          git push azure --all --force

          # Push all tags
          git push azure --tags --force

          echo "✅ Successfully mirrored to Azure Repos"
